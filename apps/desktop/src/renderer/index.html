<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <title>Offline Web Archive Builder</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">Product Phase 4</p>
      <h1>Project foundation</h1>
      <p class="lede">Create, open, validate, export, and import a portable local Project. Crawling and network access are not available in this phase.</p>

      <section aria-labelledby="create-heading">
        <h2 id="create-heading">Create Project</h2>
        <div class="fields">
          <label>Name <input id="project-name" value="My Archive" maxlength="120"></label>
          <label>Slug <input id="project-slug" value="my-archive" pattern="[a-z0-9]+(?:-[a-z0-9]+)*"></label>
        </div>
        <button data-action="create" type="button">Choose destination and create</button>
      </section>

      <section aria-labelledby="operations-heading">
        <h2 id="operations-heading">Project operations</h2>
        <div class="actions">
          <button data-action="open" type="button">Open</button>
          <button data-action="validate" type="button">Validate</button>
          <button data-action="export" type="button">Export ZIP</button>
          <button data-action="import" type="button">Import ZIP</button>
          <button data-action="close" type="button">Close</button>
        </div>
      </section>

      <section aria-labelledby="status-heading">
        <h2 id="status-heading">Current status</h2>
        <p id="status" role="status" aria-live="polite">No Project selected.</p>
        <dl id="result"></dl>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
